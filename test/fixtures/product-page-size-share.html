<!doctype html>
<!-- Sanitized from the real PDP www.usesul.com.br/usesul/product/paranaense-pe-vermelho (2026-10-05): two title headers (phone: before the gallery,

<html lang="pt-BR">
<head>

<title>Camiseta Paranaense | Pé Vermelho | Use Sul</title>

</head>

<turbo-frame id="cart"></turbo-frame>
