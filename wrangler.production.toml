name = "use-sul-widget"
main = "src/worker.js"
compatibility_date = "2026-09-23"
workers_dev = false

# NÃO publicar a rota até a zona estar Active, www estar Proxied,
# e uma compra de teste sem Worker funcionar corretamente.
[[routes]]
pattern = "www.usesul.com.br/usesul/product/*"
zone_name = "usesul.com.br"

[vars]
# Mantenha false na primeira publicação; ligue apenas no teste supervisionado.
WIDGET_ENABLED = "false"
