name = "use-sul-widget"
main = "src/worker.js"
compatibility_date = "2026-08-01"
workers_dev = false

# NÃO PUBLICAR até: zona Active, www Proxied, e uma compra nativa validada SEM Worker.
# Rotas restritas a www. Não há colisão: o loader vive em /__origens/ (fora de /usesul/).
# Domínio antigo: tudo chama o Worker, que redireciona para loja.useorigens.com.br (src/domain-move.js). A exclusão www.usesul.com.br/usesul/* precisa sair da zona.
[[routes]]
pattern = "www.usesul.com.br/*"
zone_name = "usesul.com.br"

[[routes]]
pattern = "loja.useorigens.com.br/useorigens/product/*"
zone_name = "useorigens.com.br"

# As DUAS telas de documento do checkout (tema do checkout: só CSS, só com theme-checkout, só GET de documento inteiro; em exceção a Cloudflare entrega a
# origem). Mais específicas que a exclusão `/useorigens/*` da zona; os envios do checkout (buyer, shipping_address, process_payment, payment_discount), o
# carrinho e o login continuam fora do Worker. Ficam AQUI, não só na zona: o `wrangler deploy` apaga as rotas do Worker que o TOML não declara (medido em
# 17/10/2026). Sem theme-checkout o Worker só repassa a página. Prova de execução: node scripts/checkout-routes.mjs probe.
[[routes]]
pattern = "loja.useorigens.com.br/useorigens/checkout/contact_and_shipping_details*"
zone_name = "useorigens.com.br"

[[routes]]
pattern = "loja.useorigens.com.br/useorigens/checkout/payment_methods*"
zone_name = "useorigens.com.br"

# A confirmação do pedido (payment_confirmation/<pedido>/<pagamento>), depois do pagamento: o mesmo tema do checkout (theme-checkout), só CSS, só GET de
# documento inteiro. Sem theme-checkout o Worker só repassa a página; os scripts de conversão da INK (GA4, GTM) seguem intactos.
[[routes]]
pattern = "loja.useorigens.com.br/useorigens/payment_confirmation/*"
zone_name = "useorigens.com.br"

# Conta (tema da conta, theme-account): a TELA do login, só GET de documento (o padrão não casa com o POST /store_sessions nem com outro caminho de sessão;
# o Worker só põe o atributo e o CSS, nenhum script nosso, e sem theme-account só repassa a página) e Trocas e devoluções (página de conteúdo: casca, com a
# navbar como "sobre"). Pedidos, detalhe, rastreio e avaliação já chegam pela rota de pedidos. Prova: node scripts/checkout-routes.mjs probe --conta.
[[routes]]
pattern = "loja.useorigens.com.br/useorigens/store_sessions/new*"
zone_name = "useorigens.com.br"

[[routes]]
pattern = "loja.useorigens.com.br/useorigens/exchanges_and_returns*"
zone_name = "useorigens.com.br"

[[routes]]
pattern = "loja.useorigens.com.br/__origens/*"
zone_name = "useorigens.com.br"

# Páginas "de casca" (não transacionais) que também recebem a navbar quando o escopo é de catálogo e a feature da navbar está ligada (src/scope.js shellPageKind):
# home, listagem, coleções, sobre e conta/pedidos. A rota só CHAMA o Worker; quem decide é o código (fail-closed: sem a feature da navbar ou fora do catálogo ele só repassa).
#
# ROTEAMENTO EM DUAS CAMADAS (docs/navbar-ink-busca.md, "Rotas da zona"):
#   1. Cloudflare: `/usesul*` chama o Worker e `/usesul/*` é uma EXCLUSÃO (rota SEM Worker) que tira do Worker, por padrão, tudo sob /usesul/ — login (store_sessions),
#      carrinho, checkout e o resto. A exclusão NÃO está neste arquivo de propósito: o `wrangler deploy` só declara rotas COM script; ela é criada e mantida no nível da
#      zona por scripts/zone-routes.mjs (release-navbar.sh) e fica de fora do rollback de versão. As rotas abaixo, mais específicas que a exclusão, reabrem só as páginas autorizadas.
#   2. Código: o Worker só age em caminhos EXATOS de shellPageKind/allowlist (pathname), mesmo que uma rota o chame por engano.
# A Cloudflare NÃO aceita query string em padrão de rota: `/usesul` e `/usesul/` só casam SEM query; com query quem casa é `/usesul*` (home sem barra) e a exclusão (home com barra).
# Rotas não são versionadas: um rollback de versão não as remove; o rollback do release restaura também as rotas (zone-routes.mjs restore).
[[routes]]
pattern = "loja.useorigens.com.br/useorigens*"
zone_name = "useorigens.com.br"

[[routes]]
pattern = "loja.useorigens.com.br/useorigens"
zone_name = "useorigens.com.br"

[[routes]]
pattern = "loja.useorigens.com.br/useorigens/"
zone_name = "useorigens.com.br"

[[routes]]
pattern = "loja.useorigens.com.br/useorigens/products*"
zone_name = "useorigens.com.br"

[[routes]]
pattern = "loja.useorigens.com.br/useorigens/collections/*"
zone_name = "useorigens.com.br"

[[routes]]
pattern = "loja.useorigens.com.br/useorigens/about*"
zone_name = "useorigens.com.br"

[[routes]]
pattern = "loja.useorigens.com.br/useorigens/orders*"
zone_name = "useorigens.com.br"

# Mesmos valores padrão do staging (garantido por test/config.test.js).
[vars]
# A loja única mudou para loja.useorigens.com.br/useorigens (src/stores.js withInkDomain).
SINGLE_STORE_DOMAIN = "next"
# "false" (padrão) | "dry-run" (só loga, não altera HTML) | "true" (injeta SOMENTE na allowlist).
ENABLE_WIDGET = "false"
# Módulos do loader liberados por deploy (return-link | post-add-discovery | city-search). Não amplia páginas.
WIDGET_FEATURES = "return-link"
# Caminhos EXATOS separados por vírgula, ex.: "/usesul/product/serra-catarinense".
# Vazio/ausente/malformado = nenhuma página (fail-closed). Sem curinga, prefixo, query ou barra final.
WIDGET_ALLOWLIST = ""
# Loja única (src/stores.js): regiões que a Use Sul atende. Dormente até o storefront mandar ?origens_r= nos links (só no modo loja única):
# sem o parâmetro (nem o cookie que ele grava) o visitante é sempre da Sul. Fica no TOML, e não no --var, para nenhum release a esquecer.
SERVE_REGIONS = "sul,norte,centro-oeste"

# KV do espelho do carrinho (cart-mirror). Provisionado em 2026-09-24; o ID identifica o namespace, não é credencial.
# As vars acima seguem fail-closed: produção recebe ENABLE_WIDGET/ALLOWLIST/FEATURES por --var no deploy (ver docs/fase-4-cart-bridge.md).
[[kv_namespaces]]
binding = "CART_REFS"
id = "d399f7d61d1c466a8d50211e67ed9eab"
